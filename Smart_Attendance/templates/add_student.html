<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student - Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dashboard-body">

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">🎓 Smart Attendance</div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('students') }}" class="active">Students</a>
            <a href="#">Mark Attendance</a>
            <a href="#">Reports</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout ({{ session['user'] }})</a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container form-page-container">
        <div class="form-card">
            <h2>Add New Student</h2>
            <p style="color: #64748b; margin-bottom: 20px;">Fill in the student details to register them.</p>

            {% if error %}
            <p style="color: red; background: #fee2e2; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
                {{ error }}
            </p>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>Roll Number *</label>
                    <input type="text" name="roll_no" placeholder="e.g. 101 or CS01" required>
                </div>

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" name="name" placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="form-group">
                    <label>Class / Branch *</label>
                    <input type="text" name="class_name" placeholder="e.g. TY-CS-A" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="e.g. rahul@example.com">
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Save Student</button>
                    <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
